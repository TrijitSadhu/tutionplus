{% extends "admin/change_form.html" %}

{% block object-tools-items %}
    {% if change %}
    <li>
        <button type="button" class="default" id="mpg-copy-json-btn" onclick="mpgCopyJson()">
            📋 Copy JSON
        </button>
        <span id="mpg-copy-json-status" style="margin-left:6px;color:#2e7d32;font-weight:bold;"></span>
    </li>
    <li>
        <form method="post" action="{% url 'genai:jsonimport_quick_insert' object_id %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="default"
                    onclick="return confirm('Insert this JSON into the math table now?');">
                ✅ Insert into Math Table
            </button>
        </form>
    </li>
    {% endif %}
    {{ block.super }}
{% endblock %}

{% block after_field_sets %}
{{ block.super }}
<script>
function mpgCopyJson() {
    var ta = document.getElementById('id_json_data');
    var status = document.getElementById('mpg-copy-json-status');
    if (!ta) { return; }
    navigator.clipboard.writeText(ta.value).then(function() {
        status.textContent = '✔ Copied!';
        setTimeout(function() { status.textContent = ''; }, 2000);
    }, function() {
        // Clipboard API unavailable/blocked (e.g. non-HTTPS) - fall back to manual select
        ta.focus();
        ta.select();
        status.textContent = 'Selected — press Ctrl+C to copy';
        setTimeout(function() { status.textContent = ''; }, 3000);
    });
}
</script>
{% endblock %}
