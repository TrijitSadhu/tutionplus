{% extends "admin/base_site.html" %}
{% block title %}Translate Questions | Admin{% endblock %}
{% block content %}
<h1>Translate Questions</h1>

<div style="max-width:520px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:28px;margin-top:16px;">
  <p style="font-size:15px;color:#333;margin-bottom:20px;">
    <strong>{{ count }}</strong> question{{ count|pluralize }} selected for translation.
  </p>

  <form method="post" action="../translate-start/">
    {% csrf_token %}
    <input type="hidden" name="ids" value="{{ ids }}">

    <label style="font-weight:600;display:block;margin-bottom:10px;color:#333;">Select target language:</label>

    {% for code, label in lang_choices %}
    <label style="display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:14px;transition:background 0.1s;"
           onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='#fff'">
      <input type="radio" name="language" value="{{ code }}" required style="accent-color:#3F51B5;width:16px;height:16px;">
      {{ label }}
    </label>
    {% endfor %}

    <div style="margin-top:22px;display:flex;gap:12px;">
      <button type="submit"
              style="background:#3F51B5;color:#fff;border:none;padding:10px 26px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">
        &#9654; Start Translation
      </button>
      <a href="../"
         style="background:#eee;color:#333;padding:10px 20px;border-radius:6px;font-size:14px;text-decoration:none;font-weight:600;">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
