<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wormhole — Test Timeline</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
  #c{display:block;width:100vw;height:100vh}
  #loading{
    position:fixed;inset:0;background:#00010a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:1000;transition:opacity .9s ease;
  }
  #loading.hidden{opacity:0;pointer-events:none}
  .ld-icon{font-size:3rem;animation:wormPulse 1.4s ease-in-out infinite;margin-bottom:20px}
  @keyframes wormPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  .ld-title{
    font-size:1.7rem;font-weight:900;letter-spacing:.3em;
    background:linear-gradient(90deg,#7c3aed,#ec4899,#06b6d4);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:18px;
  }
  .ld-bar{width:200px;height:2px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden}
  .ld-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#ec4899);animation:ldFill 2s ease forwards}
  @keyframes ldFill{from{width:0}to{width:100%}}
  .ld-sub{font-size:.65rem;color:rgba(255,255,255,.2);margin-top:12px;letter-spacing:.15em}
  #topbar{
    position:fixed;top:0;left:0;right:0;height:46px;
    background:rgba(0,1,10,.8);backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.05);
    display:flex;align-items:center;padding:0 20px;gap:14px;z-index:100;
  }
  .tb-brand{font-size:.88rem;font-weight:800;color:#7c3aed;letter-spacing:.04em}
  .tb-sep{color:rgba(255,255,255,.15)}
  .tb-page{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}
  .tb-links{margin-left:auto;display:flex;gap:8px}
  .tb-links a{color:rgba(255,255,255,.4);font-size:.72rem;text-decoration:none;padding:3px 12px;border:1px solid rgba(255,255,255,.08);border-radius:20px;transition:all .2s}
  .tb-links a:hover{color:#fff;border-color:rgba(255,255,255,.25)}
  #hud{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:0;align-items:stretch;
    background:rgba(0,1,10,.82);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.07);border-radius:50px;overflow:hidden;
    z-index:100;animation:hudIn .7s 1.2s ease both;white-space:nowrap;
  }
  @keyframes hudIn{from{opacity:0;transform:translateX(-50%) translateY(18px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .hud-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 20px;gap:2px;border-right:1px solid rgba(255,255,255,.05)}
  .hud-chip:last-child{border-right:none}
  .hud-val{font-size:.82rem;font-weight:700;line-height:1}
  .hud-lbl{font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3)}
  #autoBtn{
    position:fixed;top:60px;left:50%;transform:translateX(-50%);
    background:rgba(0,1,10,.85);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);border-radius:24px;
    color:rgba(255,255,255,.55);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
    padding:6px 20px;cursor:pointer;z-index:100;transition:all .2s;
  }
  #autoBtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  #ringLabel{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    background:rgba(0,1,10,.9);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;
    padding:6px 22px;font-size:.76rem;font-weight:600;letter-spacing:.08em;z-index:100;
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  #ringLabel.show{opacity:1}
  #progressBar{
    position:fixed;left:50%;transform:translateX(-50%);top:50px;
    width:min(320px,85vw);height:3px;
    background:rgba(255,255,255,.05);border-radius:2px;z-index:100;
  }
  #progressFill{height:100%;border-radius:2px;background:linear-gradient(90deg,#7c3aed,#ec4899);width:0;transition:width .4s ease}
  #clickHint{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    font-size:.65rem;color:rgba(255,255,255,.2);letter-spacing:.1em;text-transform:uppercase;
    pointer-events:none;animation:hintFade 3.5s 3s ease both;
  }
  @keyframes hintFade{0%,70%{opacity:1}100%{opacity:0}}
  @media(max-width:600px){
    #hud{flex-wrap:wrap;border-radius:16px;width:calc(100% - 32px);justify-content:center;bottom:16px}
    .hud-chip{border-right:none;border-bottom:1px solid rgba(255,255,255,.05);width:45%}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading">
  <div class="ld-icon">🌀</div>
  <div class="ld-title">WORMHOLE</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
  <div class="ld-sub">MAPPING YOUR TEST TIMELINE</div>
</div>

<nav id="topbar">
  <span class="tb-brand">TutionPlus</span>
  <span class="tb-sep">|</span>
  <span class="tb-page">Wormhole</span>
  <div class="tb-links">
    <a href="/api/performance-dashboard/">← Dashboard</a>
    <a href="/api/forest/">Forest</a>
    <a href="/api/cave/">Cave</a>
    <a href="/api/neural/">Neural</a>
    <a href="/api/stellar/">Stellar</a>
  </div>
</nav>

<div id="hud">
  <div class="hud-chip"><span class="hud-val" id="hudExam">—</span><span class="hud-lbl">Exam</span></div>
  <div class="hud-chip"><span class="hud-val" id="hudLevel" style="color:#a78bfa">—</span><span class="hud-lbl">Level</span></div>
  <div class="hud-chip"><span class="hud-val" id="hudStreak" style="color:#f472b6">0 🔥</span><span class="hud-lbl">Streak</span></div>
  <div class="hud-chip"><span class="hud-val" id="hudTests">0</span><span class="hud-lbl">Tests</span></div>
</div>

<button id="autoBtn" onclick="toggleFly()">▶ FLY THROUGH</button>
<div id="progressBar"><div id="progressFill"></div></div>
<div id="ringLabel"></div>
<div id="clickHint">Rings = your test attempts · closest = most recent</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>

<script>
/* ═══════════════════════════════════════════════════════
   WORMHOLE — First-Person Test Timeline Tunnel
   Each RING = one mocktest attempt (most recent = nearest).
   Ring inner radius = kept constant.
   Ring tube thickness = score (thicker = higher score).
   Ring color = confusion level (purple→pink→teal gradient).
   Ring warp = confusion index warps ring into oval.
   Particles streaming through tunnel = mastery_streak density.
   Central orb at far end = your level strength.
   "FLY THROUGH" auto-animates camera along tunnel axis.
═══════════════════════════════════════════════════════ */

// ── Scene ────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x00010a);
scene.fog = new THREE.FogExp2(0x00010a, 0.025);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 200);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// ── Composer ──────────────────────────────────────────
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
composer.addPass(new THREE.UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  2.0, 0.55, 0.10
));

// ── Ambient ───────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x050010, 2.5));

// ── Stars ─────────────────────────────────────────────
(function addStars(){
  const count=600;
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=40+Math.random()*60;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    pos[i*3]  =r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
    pos[i*3+2]=r*Math.cos(phi);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9988ff,size:0.3,transparent:true,opacity:0.5})));
})();

// ── Color mapping ─────────────────────────────────────
function ringColor(confusion, score){
  // Low confusion + high score = teal/cyan
  // High confusion = magenta/red
  // Medium = purple/violet (wormhole default)
  const c = confusion||0;
  if(c<=0.2) return new THREE.Color(0x06b6d4);
  if(c<=0.5) return new THREE.Color(0x7c3aed);
  return new THREE.Color(0xec4899);
}

// ── State ────────────────────────────────────────────
let   flying   = false;
let   flyT     = 0;              // camera Z position target
const RING_SPACING = 5.0;        // z distance between rings
const MAX_FLY_Z    = -120;
const ringData     = [];         // {z, label, color, score}
const clock        = new THREE.Clock();
const ringLabel    = document.getElementById('ringLabel');
let   progressFrac = 0;

window.toggleFly = function(){
  flying = !flying;
  const btn = document.getElementById('autoBtn');
  if(flying){
    btn.textContent='⏹ STOP';
    flyT = camera.position.z;
  } else {
    btn.textContent='▶ FLY THROUGH';
  }
};

// ── Build wormhole ────────────────────────────────────
function buildWormhole(attempts, worldData){
  // Fallback data
  if(!attempts.length){
    attempts=[
      {total_score:72, confusion_index:0.3, date:'Test 1'},
      {total_score:58, confusion_index:0.5, date:'Test 2'},
      {total_score:85, confusion_index:0.1, date:'Test 3'},
      {total_score:44, confusion_index:0.7, date:'Test 4'},
      {total_score:91, confusion_index:0.05,date:'Test 5'},
    ];
  }

  const totalRings = attempts.length;
  document.getElementById('hudTests').textContent = totalRings;

  // ── Wormhole tube walls ─────────────────────────────
  const tubeLength = (totalRings+2)*RING_SPACING;
  const tubeGeo    = new THREE.CylinderGeometry(3.2, 3.2, tubeLength, 32, 1, true);
  const tubeMat    = new THREE.MeshStandardMaterial({
    color:0x120825, emissive:0x120825, emissiveIntensity:0.6,
    side:THREE.BackSide, roughness:0.8, metalness:0.1,
    transparent:true, opacity:0.4,
  });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  tube.rotation.x = Math.PI/2;
  tube.position.z = -(tubeLength/2 - 5);
  scene.add(tube);

  // Tube inner glow rings (decorative)
  for(let i=0;i<8;i++){
    const gr = new THREE.Mesh(
      new THREE.TorusGeometry(3.2, 0.04, 8, 32),
      new THREE.MeshStandardMaterial({color:0x3b0764, emissive:0x3b0764, emissiveIntensity:2.5})
    );
    gr.position.z = -i*(tubeLength/7);
    scene.add(gr);
  }

  // ── Data rings ─────────────────────────────────────
  // Reverse attempts so most recent is closest (smallest z)
  const sorted = [...attempts].reverse();

  sorted.forEach((a, i)=>{
    const score  = Math.min(1, (a.total_score||50)/100);
    const confusion = a.confusion_index || 0;
    const color  = ringColor(confusion, score);
    const tube   = 0.05 + score*0.28;
    const radX   = 1.8 + score*0.8;
    const radY   = radX * (1.0 - confusion*0.3); // confusion squishes to oval
    const zPos   = -(2.5 + i*RING_SPACING);

    // Ellipse ring (use TorusGeometry, then scale y for oval)
    const torusR = (radX+radY)/2;
    const ring   = new THREE.Mesh(
      new THREE.TorusGeometry(torusR, tube, 12, 64),
      new THREE.MeshStandardMaterial({
        color:color.clone(), emissive:color.clone(),
        emissiveIntensity:1.4+score*1.8,
        roughness:0.15, metalness:0.7,
        transparent:true, opacity:0.88,
      })
    );
    ring.position.z = zPos;
    ring.scale.y    = radY/torusR;
    ring.scale.x    = radX/torusR;
    scene.add(ring);

    // Ring glow light
    const rl = new THREE.PointLight(color, 0.8+score*1.2, 6+score*4, 2);
    rl.position.z = zPos;
    scene.add(rl);

    // Score label on ring
    const sc = document.createElement('canvas');
    sc.width=220; sc.height=80;
    const cx=sc.getContext('2d');
    cx.fillStyle='rgba(0,0,0,.7)';
    cx.beginPath(); cx.roundRect(0,0,220,80,8); cx.fill();
    cx.fillStyle='#'+color.getHexString(); cx.font='bold 28px Segoe UI,sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(Math.round(score*100)+'%', 110, 32);
    cx.fillStyle='rgba(255,255,255,.4)'; cx.font='14px Segoe UI,sans-serif';
    const label = a.mocktest_name || a.date || `Test ${sorted.length-i}`;
    cx.fillText(label, 110, 56);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
    sp.scale.set(2.5, 1.0, 1);
    sp.position.set(radX+1.2, 0.1, zPos);
    scene.add(sp);

    ringData.push({z:zPos, label, color:'#'+color.getHexString(), score:Math.round(score*100)});
  });

  // ── Central orb at tunnel end (level strength) ─────
  const orbStrength = worldData.overall_strength || 0.5;
  const orbColor    = new THREE.Color().setHSL(0.75+orbStrength*0.2, 0.9, 0.55);
  const orbZ        = -(sorted.length+2)*RING_SPACING;
  const orb         = new THREE.Mesh(
    new THREE.SphereGeometry(1.0+orbStrength*0.8, 24, 18),
    new THREE.MeshStandardMaterial({
      color:orbColor, emissive:orbColor, emissiveIntensity:3.0+orbStrength*3,
      roughness:0.1, metalness:0.9,
    })
  );
  orb.position.z = orbZ;
  scene.add(orb);
  scene.add(new THREE.PointLight(new THREE.Color(0xa78bfa), 2.5+orbStrength*2, 20, 1.5)).position.z = orbZ;

  // ── Streaming particles ─────────────────────────────
  const streak   = worldData.mastery_streak||0;
  const pCount   = Math.min(1200, 80+streak*60);
  const pPos     = new Float32Array(pCount*3);
  for(let i=0;i<pCount;i++){
    const a2  = Math.random()*Math.PI*2;
    const r2  = 0.2+Math.random()*2.8;
    pPos[i*3]   = Math.cos(a2)*r2;
    pPos[i*3+1] = Math.sin(a2)*r2;
    pPos[i*3+2] = -Math.random()*(totalRings+3)*RING_SPACING;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    color:0xc4b5fd, size:0.06, transparent:true, opacity:0.55,
  }));
  scene.add(particles);

  // Animate particles forward
  scene.userData.particles   = { geo:pGeo, total:pCount, maxZ:-(totalRings+3)*RING_SPACING };
}

// ── Update ring label ─────────────────────────────────
function updateRingLabel(camZ){
  // Find nearest ring
  let best=null, bestD=1e9;
  ringData.forEach(r=>{
    const d=Math.abs(r.z-camZ);
    if(d<bestD){ bestD=d; best=r; }
  });
  if(best && bestD<RING_SPACING*0.7){
    ringLabel.textContent=`${best.label} · ${best.score}%`;
    ringLabel.style.borderColor=best.color;
    ringLabel.classList.add('show');
  } else {
    ringLabel.classList.remove('show');
  }
}

// ── Render loop ───────────────────────────────────────
let time = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  // Flying mode
  if(flying && ringData.length){
    flyT -= dt*3.5;
    const minZ = ringData[ringData.length-1].z - 4;
    if(flyT < minZ){ flyT=minZ; flying=false; document.getElementById('autoBtn').textContent='▶ FLY THROUGH'; }
    camera.position.z += (flyT - camera.position.z)*0.08;
    progressFrac = Math.min(1, Math.abs(camera.position.z-6)/Math.abs(flyT-6+0.01));
    document.getElementById('progressFill').style.width=(progressFrac*100)+'%';
  }

  // Gentle camera drift
  camera.position.x = Math.sin(time*0.2)*0.12;
  camera.position.y = Math.cos(time*0.18)*0.12;
  camera.lookAt(0, 0, camera.position.z-12);

  // Particle stream
  const pd = scene.userData.particles;
  if(pd){
    const pos=pd.geo.attributes.position;
    for(let i=0;i<pd.total;i++){
      let z=pos.getZ(i)+dt*4.5;
      if(z>7.0){
        z=pd.maxZ;
        pos.setX(i,(Math.random()-0.5)*5.5);
        pos.setY(i,(Math.random()-0.5)*5.5);
      }
      pos.setZ(i,z);
    }
    pos.needsUpdate=true;
  }

  updateRingLabel(camera.position.z);
  composer.render();
}

// ── Init ──────────────────────────────────────────────
async function safeGet(url){
  try{ const r=await fetch(url,{credentials:'same-origin'}); return r.ok?r.json():null; }
  catch{ return null; }
}

async function init(){
  const [worldData, histData] = await Promise.all([
    safeGet('/api/world-state/'),
    safeGet('/api/mocktest-history/'),
  ]);
  const w  = worldData||{};
  const attempts=(histData&&histData.attempts)?histData.attempts:[];

  document.getElementById('hudExam').textContent  = w.exam  ||'Your Exam';
  document.getElementById('hudLevel').textContent = w.level ||'Beginner';
  document.getElementById('hudStreak').textContent= (w.mastery_streak||0)+' 🔥';

  buildWormhole(attempts, w);

  const loader=document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(()=>loader.remove(), 950);
  animate();
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

// Keyboard: left/right arrow or W/S to fly
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' ') window.toggleFly();
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){
    if(flying) window.toggleFly();
    flyT=camera.position.z+10;
    camera.position.z=Math.min(6,camera.position.z+3);
    document.getElementById('progressFill').style.width='0%';
  }
});

init();
</script>
</body>
</html>
