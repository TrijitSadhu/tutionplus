{% load static %}

<!DOCTYPE html>
<html>
<head>
	<title>Performance World — Experiment</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'students/world/css/world.css' %}">
	<style>
	.insight-btn {
		background: #111;
		color: #fff;
		border: 1px solid #444;
		padding: 6px 12px;
		margin-left: 20px;
		cursor: pointer;
		border-radius: 4px;
	}
	.insight-btn:hover {
		background: #222;
	}
	</style>
</head>
<body>

<nav class="world-navbar">
	<div class="world-brand">Performance World — Experiment</div>
	<button id="toggleInsightsBtn" class="insight-btn">Show Insights</button>
</nav>

<div id="world-container">
	<canvas id="worldCanvas"></canvas>
</div>

<div id="stats-panel">
	<h3>Details</h3>
	<div id="stats-content">No data yet</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>

<!-- Post Processing -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/ShaderPass.js"></script>

<!-- Shaders -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/LuminosityHighPassShader.js"></script>

<!-- Controls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>

<script src="{% static 'students/world/js/experiment.js' %}"></script>
<script src="{% static 'students/world/js/world_experiment.js' %}"></script>

</body>
</html>
