<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neural — Academic Mind Map</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
  #c{display:block;width:100vw;height:100vh}

  /* Loading */
  #loading{
    position:fixed;inset:0;background:#000212;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:1000;transition:opacity 0.9s ease;
  }
  #loading.hidden{opacity:0;pointer-events:none}
  .ld-ring{
    width:70px;height:70px;border-radius:50%;
    border:2px solid transparent;
    border-top-color:#7c3aed;border-right-color:#06b6d4;
    animation:ldSpin 1.1s linear infinite;margin-bottom:22px;
  }
  @keyframes ldSpin{to{transform:rotate(360deg)}}
  .ld-title{
    font-size:1.7rem;font-weight:900;letter-spacing:0.3em;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:18px;
  }
  .ld-bar{width:200px;height:2px;background:rgba(255,255,255,0.07);border-radius:1px;overflow:hidden}
  .ld-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4);animation:ldFill 2s ease forwards}
  @keyframes ldFill{from{width:0}to{width:100%}}
  .ld-sub{font-size:0.65rem;color:rgba(255,255,255,0.2);margin-top:12px;letter-spacing:0.15em}

  /* Topbar */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:46px;
    background:rgba(0,2,18,0.75);backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,0.05);
    display:flex;align-items:center;padding:0 20px;gap:14px;z-index:100;
  }
  .tb-brand{font-size:.88rem;font-weight:800;color:#7c3aed;letter-spacing:.04em}
  .tb-sep{color:rgba(255,255,255,0.15)}
  .tb-page{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}
  .tb-links{margin-left:auto;display:flex;gap:8px}
  .tb-links a{
    color:rgba(255,255,255,.4);font-size:.72rem;text-decoration:none;
    padding:3px 12px;border:1px solid rgba(255,255,255,.08);border-radius:20px;
    transition:all .2s;
  }
  .tb-links a:hover{color:#fff;border-color:rgba(255,255,255,.25)}

  /* HUD */
  #hud{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:0;align-items:stretch;
    background:rgba(0,2,18,0.80);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.07);border-radius:50px;overflow:hidden;
    z-index:100;animation:hudIn .7s 1.2s ease both;white-space:nowrap;
  }
  @keyframes hudIn{
    from{opacity:0;transform:translateX(-50%) translateY(18px)}
    to{opacity:1;transform:translateX(-50%) translateY(0)}
  }
  .hud-chip{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px 20px;gap:2px;border-right:1px solid rgba(255,255,255,.05);
  }
  .hud-chip:last-child{border-right:none}
  .hud-val{font-size:.82rem;font-weight:700;line-height:1}
  .hud-lbl{font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3)}

  /* Hover label */
  #hoverLabel{
    position:fixed;pointer-events:none;z-index:200;
    background:rgba(0,2,18,0.9);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);border-radius:10px;
    padding:8px 16px;opacity:0;transition:opacity .15s;
    display:flex;flex-direction:column;gap:3px;
  }
  #hoverLabel.show{opacity:1}
  #hoverLabel .hl-name{font-weight:700;font-size:.86rem}
  #hoverLabel .hl-stat{color:rgba(255,255,255,.5);font-size:.72rem}

  /* Info panel */
  #infoPanel{
    position:fixed;top:56px;right:0;width:270px;
    background:rgba(0,2,18,0.92);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.07);border-right:none;
    border-radius:12px 0 0 12px;padding:22px 20px;z-index:100;
    transform:translateX(102%);
    transition:transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  #infoPanel.open{transform:translateX(0)}
  .ip-close{
    position:absolute;top:14px;right:16px;background:none;border:none;
    color:rgba(255,255,255,.3);font-size:1rem;cursor:pointer;padding:4px;
  }
  .ip-close:hover{color:#fff}
  .ip-name{font-size:1.05rem;font-weight:800;margin-bottom:16px}
  .ip-metric{margin-bottom:12px}
  .ip-row{display:flex;justify-content:space-between;font-size:.74rem;margin-bottom:4px}
  .ip-muted{color:rgba(255,255,255,.4)}
  .ip-bar-track{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .ip-bar-fill{height:100%;border-radius:3px;transition:width .7s ease}
  .ip-divider{height:1px;background:rgba(255,255,255,.05);margin:14px 0}
  .ip-legend{font-size:.68rem;color:rgba(255,255,255,.3);line-height:1.9}
  .ip-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

  /* Legend top-right */
  #legend{
    position:fixed;top:56px;left:20px;
    background:rgba(0,2,18,0.75);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.06);border-radius:10px;
    padding:12px 16px;font-size:.68rem;color:rgba(255,255,255,.4);
    line-height:2;z-index:100;animation:hudIn .6s 1.5s ease both;
  }

  /* Click hint */
  #clickHint{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    font-size:.65rem;color:rgba(255,255,255,.2);letter-spacing:.1em;text-transform:uppercase;
    pointer-events:none;animation:hintFade 3.5s 3s ease both;
  }
  @keyframes hintFade{0%,70%{opacity:1}100%{opacity:0}}

  @media(max-width:600px){
    #hud{flex-wrap:wrap;border-radius:16px;width:calc(100% - 32px);justify-content:center;bottom:16px}
    .hud-chip{border-right:none;border-bottom:1px solid rgba(255,255,255,.05);width:45%}
    #infoPanel{width:100%;top:auto;bottom:0;border-radius:16px 16px 0 0;border-right:1px solid rgba(255,255,255,.07);transform:translateY(102%)}
    #infoPanel.open{transform:translateY(0)}
    #legend{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading">
  <div class="ld-ring"></div>
  <div class="ld-title">NEURAL</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
  <div class="ld-sub">BUILDING YOUR MIND MAP</div>
</div>

<nav id="topbar">
  <span class="tb-brand">TutionPlus</span>
  <span class="tb-sep">|</span>
  <span class="tb-page">Neural View</span>
  <div class="tb-links">
    <a href="/api/performance-dashboard/">← Dashboard</a>
    <a href="/api/stellar/">Stellar</a>
    <a href="/api/world/">World</a>
  </div>
</nav>

<div id="legend">
  <span style="color:#06b6d4">●</span> Subject hub node<br>
  <span style="color:#10b981">●</span> Strong topic (bright edge)<br>
  <span style="color:#ef4444">●</span> Weak topic (dim broken edge)<br>
  <span style="color:#a78bfa">●</span> Central mind (your level)<br>
  <span style="color:rgba(255,255,255,.25)">—</span> Edge thickness = accuracy
</div>

<div id="hud">
  <div class="hud-chip">
    <span class="hud-val" id="hudExam">—</span>
    <span class="hud-lbl">Exam</span>
  </div>
  <div class="hud-chip">
    <span class="hud-val" id="hudLevel" style="color:#a78bfa">—</span>
    <span class="hud-lbl">Level</span>
  </div>
  <div class="hud-chip">
    <span class="hud-val" id="hudStreak" style="color:#06b6d4">0 🔥</span>
    <span class="hud-lbl">Streak</span>
  </div>
  <div class="hud-chip">
    <span class="hud-val" id="hudNodes" style="color:#10b981">0</span>
    <span class="hud-lbl">Nodes</span>
  </div>
</div>

<div id="clickHint">Click any node for details</div>

<div id="hoverLabel">
  <span class="hl-name" id="hlName"></span>
  <span class="hl-stat" id="hlStat"></span>
</div>

<div id="infoPanel">
  <button class="ip-close" onclick="closePanel()">✕</button>
  <div id="ipContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>

<script>
/* ═══════════════════════════════════════════════════════
   NEURAL — Academic Mind-Map Universe
   Central node = your level.
   Ring of subject hub nodes, sized by strength.
   Topic child nodes hang off each hub via glowing edges.
   Strong topics = bright teal nodes + fat edges.
   Weak topics   = red nodes + dim flickering edges.
═══════════════════════════════════════════════════════ */

// ── Scene setup ────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x000212);

const camera   = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 18, 38);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.04;
controls.minDistance     = 6;
controls.maxDistance     = 70;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.5;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ── Post-processing ──────────────────────────────────
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
composer.addPass(new THREE.UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.6,   // strength
  0.6,   // radius
  0.18   // threshold
));

// ── Ambient light ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x050510, 2));

// ── State ─────────────────────────────────────────────
const clickables  = [];
const pulseNodes  = []; // {mesh, baseSz, speed, phase}
const edgeFlicker = []; // {line, baseOp, speed, phase} for weak edges
const floatNodes  = []; // {mesh, baseY, speed, phase} for slow float
let   hoveredMesh = null;
const raycaster   = new THREE.Raycaster();
const mouse       = new THREE.Vector2(-9999,-9999);

// ── Helpers ───────────────────────────────────────────
const LEVEL_COLORS = {
  'beginner':     0xa78bfa,
  'intermediate': 0x60a5fa,
  'advanced':     0x06b6d4,
  'expert':       0x34d399,
  'master':       0xf472b6,
};

const HUB_COLORS = [0x06b6d4, 0x8b5cf6, 0x10b981, 0xf59e0b, 0xef4444, 0x3b82f6];

function pct(v){ return Math.round((v||0)*100); }
function hexCss(n){ return '#'+n.toString(16).padStart(6,'0'); }

function confColor(v){
  if(v<=0.25) return 0x06b6d4;
  if(v<=0.5)  return 0xf59e0b;
  return 0xef4444;
}

// Thick tube-like edge between two positions
function makeEdge(from, to, color, opacity, width){
  const pts = [from.clone(), to.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color, transparent:true, opacity, linewidth: width||1,
  });
  return new THREE.Line(geo, mat);
}

// Sprite label (reuse same pattern as stellar)
function makeSprite(text, opts){
  const W=512, H=100;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=opts.bg||'rgba(0,0,0,.55)';
  const r=10;
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(W-r,0);ctx.quadraticCurveTo(W,0,W,r);
  ctx.lineTo(W,H-r);ctx.quadraticCurveTo(W,H,W-r,H);
  ctx.lineTo(r,H);ctx.quadraticCurveTo(0,H,0,H-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=opts.border||'rgba(255,255,255,.2)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=opts.color||'#fff';
  ctx.font=opts.font||'bold 26px Segoe UI,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const lbl=text.length>32?text.slice(0,31)+'…':text;
  ctx.fillText(lbl, W/2, H/2);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false,
  }));
  sp.scale.set(opts.w||4.5, opts.h||1.1, 1);
  return sp;
}

// ── Build central "Mind" node ──────────────────────────
function buildCenterNode(levelStr){
  const key   = (levelStr||'beginner').toLowerCase();
  const color = LEVEL_COLORS[key] || LEVEL_COLORS['beginner'];

  // Core sphere
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 40, 40),
    new THREE.MeshStandardMaterial({
      color, emissive:color, emissiveIntensity:4.0, roughness:0.2, metalness:0,
    })
  );
  scene.add(core);
  pulseNodes.push({mesh:core, baseSz:1.4, speed:1.2, phase:0});

  // Inner halo
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(2.1,28,28),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.06, side:THREE.BackSide})
  ));
  // Outer glow ring
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(3.2,24,24),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.025, side:THREE.BackSide})
  ));

  // Center light
  const light = new THREE.PointLight(color, 2.0, 38, 1.5);
  scene.add(light);

  // Level label
  const sp = makeSprite(levelStr||'Beginner', {
    bg:'rgba(0,0,0,.6)', border:hexCss(color), color:'#fff',
    font:'bold 28px Segoe UI,sans-serif', w:3.8, h:1.0,
  });
  sp.position.set(0, 2.2, 0);
  scene.add(sp);
}

// ── Build subject hub + its topic children ─────────────
function buildHub(subj, idx, totalSubj, weakTopics, strongTopics){
  const color    = HUB_COLORS[idx % HUB_COLORS.length];
  const strength = subj.strength_score||0.5;
  const prev     = subj.previous_strength_score||0.4;
  const conf     = subj.average_confusion_index||0;
  const hubR     = 0.35 + strength * 0.85;  // hub node radius

  // Hub position — evenly distributed on a ring at radius 10
  const ringR  = 10;
  const angle  = (idx / totalSubj) * Math.PI * 2;
  const hx     = Math.cos(angle) * ringR;
  const hz     = Math.sin(angle) * ringR;
  const hy     = (Math.sin(angle * 2.3) * 2.0); // slight Y variation

  const hubPos = new THREE.Vector3(hx, hy, hz);

  // Edge: center → hub (thickness = strength)
  const edgeColor = color;
  const edgeOp    = 0.25 + strength * 0.45;
  const e = makeEdge(new THREE.Vector3(0,0,0), hubPos, edgeColor, edgeOp, 1);
  scene.add(e);

  // Hub mesh
  const hubMat = new THREE.MeshStandardMaterial({
    color, emissive:color,
    emissiveIntensity: 1.2 + strength * 2.0,
    roughness:0.3, metalness:0,
  });
  const hubMesh = new THREE.Mesh(new THREE.SphereGeometry(hubR, 28, 28), hubMat);
  hubMesh.position.copy(hubPos);
  hubMesh.userData = {
    type:'hub', subject:subj, color, isHub:true,
    label: subj.name,
    stat:  `Strength ${pct(strength)}%  ·  Confusion ${pct(conf)}%`,
  };
  scene.add(hubMesh);
  clickables.push(hubMesh);
  pulseNodes.push({mesh:hubMesh, baseSz:hubR, speed:0.8+conf*1.2, phase:idx*0.9});
  floatNodes.push({mesh:hubMesh, baseY:hy, speed:0.35+idx*0.07, phase:idx*1.1});

  // Halo around hub
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(hubR*1.4, 18, 18),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.05+strength*0.04, side:THREE.BackSide})
  ));

  // Hub label
  const sp = makeSprite(subj.name, {
    bg:'rgba(0,0,0,.55)', border:hexCss(color), color:'#fff',
    font:'bold 24px Segoe UI,sans-serif', w:3.6, h:0.95,
  });
  sp.position.set(hx, hy + hubR + 1.1, hz);
  scene.add(sp);

  // ── Topic child nodes ───────────────────────────────

  const myStrong = strongTopics.filter(t =>
    t.subject && t.subject.toLowerCase() === (subj.name||'').toLowerCase()
  ).slice(0, 4);

  const myWeak = weakTopics.filter(t =>
    t.subject && t.subject.toLowerCase() === (subj.name||'').toLowerCase()
  ).slice(0, 5);

  const allTopics = [
    ...myStrong.map(t => ({...t, kind:'strong'})),
    ...myWeak.map(t =>   ({...t, kind:'weak'})),
  ];

  allTopics.forEach((t, ti) => {
    const isStrong = t.kind === 'strong';
    const tColor   = isStrong ? 0x10b981 : 0xef4444;
    const tStr     = t.strength || (isStrong ? 0.75 : 0.3);
    const tR       = 0.14 + tStr * 0.22;

    // Spread child nodes in a small sphere around the hub
    const ta = (ti / allTopics.length) * Math.PI * 2;
    const te = (Math.random() - 0.5) * Math.PI * 0.8;
    const td = hubR * 2.2 + ti * 0.55;
    const cx = hx + Math.cos(ta) * Math.cos(te) * td;
    const cy = hy + Math.sin(te) * td * 0.6;
    const cz = hz + Math.sin(ta) * Math.cos(te) * td;
    const cPos = new THREE.Vector3(cx, cy, cz);

    // Edge: hub → topic
    const tEdgeOp  = isStrong ? 0.55 : 0.2;
    const tEdge    = makeEdge(hubPos, cPos, tColor, tEdgeOp, 1);
    scene.add(tEdge);
    if(!isStrong){
      edgeFlicker.push({line:tEdge, baseOp:tEdgeOp, speed:2+Math.random()*2, phase:Math.random()*6.28});
    }

    // Topic node
    const tMesh = new THREE.Mesh(
      new THREE.SphereGeometry(tR, 14, 14),
      new THREE.MeshStandardMaterial({
        color:tColor, emissive:tColor,
        emissiveIntensity: isStrong ? 2.2 : 1.0,
        roughness:0.4, metalness:0,
      })
    );
    tMesh.position.set(cx, cy, cz);
    tMesh.userData = {
      type:'topic', kind:t.kind, topic:t, color:tColor,
      label: t.chapter || t.subject || 'Topic',
      stat:  `${t.subject||''} · Accuracy ${pct(t.accuracy)}%  ·  Confusion ${pct(t.confusion)}%`,
    };
    scene.add(tMesh);
    clickables.push(tMesh);
    pulseNodes.push({mesh:tMesh, baseSz:tR, speed:1.2+(Math.random()*.8), phase:Math.random()*6.28});
  });
}

// ── Deep-space particle dust ───────────────────────────
(function buildDust(){
  const n   = 9000;
  const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r   = 60+Math.random()*200;
    const th  = Math.random()*Math.PI*2;
    const ph  = Math.acos(2*Math.random()-1);
    pos[i*3]  = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]= r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2]= r*Math.cos(ph);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color:0x5566ff, size:0.35, sizeAttenuation:true, transparent:true, opacity:0.55,
  })));
})();

// ── Synaptic spark particles (random bursts along edges) ──
const sparks = [];
function spawnSpark(from, to, color){
  const t    = Math.random();
  const pos  = from.clone().lerp(to, t);
  const geo  = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([pos.x,pos.y,pos.z]),3));
  const mesh = new THREE.Points(geo, new THREE.PointsMaterial({
    color, size:0.18, transparent:true, opacity:1,
  }));
  scene.add(mesh);
  const dir = to.clone().sub(from).normalize().multiplyScalar(6+Math.random()*6);
  sparks.push({mesh, vel:dir, life:1, decay:2.2+Math.random()*1.5});
}

function tickSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.life -= s.decay*dt;
    const p=s.mesh.geometry.attributes.position;
    p.setXYZ(0, p.getX(0)+s.vel.x*dt, p.getY(0)+s.vel.y*dt, p.getZ(0)+s.vel.z*dt);
    p.needsUpdate=true;
    s.mesh.material.opacity = Math.max(0, s.life);
    if(s.life<=0){
      scene.remove(s.mesh);
      s.mesh.geometry.dispose(); s.mesh.material.dispose();
      sparks.splice(i,1);
    }
  }
}

// Track hub positions for spark spawning
const hubEdges = []; // {from, to, color}

// ── Interaction ───────────────────────────────────────
const hoverLabel = document.getElementById('hoverLabel');
const hlName     = document.getElementById('hlName');
const hlStat     = document.getElementById('hlStat');
const infoPanel  = document.getElementById('infoPanel');
const ipContent  = document.getElementById('ipContent');

window.closePanel = () => infoPanel.classList.remove('open');

function openPanel(ud){
  if(ud.isHub){
    const s   = ud.subject;
    const css = hexCss(ud.color);
    const str = pct(s.strength_score);
    const prev= pct(s.previous_strength_score);
    const conf= pct(s.average_confusion_index);
    const confCss = conf>50?'#ef4444':conf>25?'#f59e0b':'#10b981';
    const delta = str-prev;
    const dHtml = delta>=0
      ? `<span style="color:#10b981">▲${delta}%</span>`
      : `<span style="color:#ef4444">▼${Math.abs(delta)}%</span>`;
    ipContent.innerHTML = `
      <div class="ip-name" style="color:${css}">${s.name}</div>
      <div class="ip-metric">
        <div class="ip-row"><span class="ip-muted">Strength</span><span style="font-weight:700">${str}% ${dHtml}</span></div>
        <div class="ip-bar-track"><div class="ip-bar-fill" style="width:${str}%;background:${css}"></div></div>
      </div>
      <div class="ip-metric">
        <div class="ip-row"><span class="ip-muted">Previous</span><span style="color:rgba(255,255,255,.5)">${prev}%</span></div>
        <div class="ip-bar-track"><div class="ip-bar-fill" style="width:${prev}%;background:rgba(255,255,255,.22)"></div></div>
      </div>
      <div class="ip-metric">
        <div class="ip-row"><span class="ip-muted">Confusion</span><span style="font-weight:700;color:${confCss}">${conf}%</span></div>
        <div class="ip-bar-track"><div class="ip-bar-fill" style="width:${conf}%;background:${confCss}"></div></div>
      </div>
      <div class="ip-row" style="margin-top:4px"><span class="ip-muted">Confused Q</span><span style="font-weight:700">${s.total_confused_questions||0}</span></div>
      <div class="ip-divider"></div>
      <div class="ip-legend">
        <span class="ip-dot" style="background:#10b981"></span> Teal = strong topic<br>
        <span class="ip-dot" style="background:#ef4444"></span> Red = weak topic<br>
        Edge brightness = accuracy
      </div>`;
  } else {
    const t   = ud.topic||{};
    const css = ud.kind==='strong'?'#10b981':'#ef4444';
    ipContent.innerHTML = `
      <div class="ip-name" style="color:${css}">${t.chapter||'Topic'}</div>
      <div class="ip-row"><span class="ip-muted">Subject</span><span style="font-weight:700">${t.subject||'—'}</span></div>
      <div class="ip-metric" style="margin-top:10px">
        <div class="ip-row"><span class="ip-muted">Accuracy</span><span style="font-weight:700">${pct(t.accuracy)}%</span></div>
        <div class="ip-bar-track"><div class="ip-bar-fill" style="width:${pct(t.accuracy)}%;background:${css}"></div></div>
      </div>
      <div class="ip-metric">
        <div class="ip-row"><span class="ip-muted">Confusion</span><span style="font-weight:700">${pct(t.confusion)}%</span></div>
        <div class="ip-bar-track"><div class="ip-bar-fill" style="width:${pct(t.confusion)}%;background:#f59e0b"></div></div>
      </div>
      <div class="ip-row"><span class="ip-muted">Strength</span><span style="font-weight:700">${pct(t.strength)}%</span></div>`;
  }
  infoPanel.classList.add('open');
}

window.addEventListener('mousemove', e => {
  mouse.x =  (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  hoverLabel.style.left=(e.clientX+16)+'px';
  hoverLabel.style.top =(e.clientY-12)+'px';
});
window.addEventListener('click', () => {
  if(hoveredMesh) openPanel(hoveredMesh.userData);
});
window.addEventListener('touchend', e => {
  const t=e.changedTouches[0];
  mouse.x=(t.clientX/innerWidth)*2-1;
  mouse.y=-(t.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(clickables);
  if(hits.length) openPanel(hits[0].object.userData);
},{passive:true});

// ── Animation loop ────────────────────────────────────
const clock = new THREE.Clock();
let   time  = 0;
let   lastSpark = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  // Pulse all emissive nodes
  pulseNodes.forEach(p => {
    const s = p.baseSz * (1 + Math.sin(time*p.speed+p.phase)*0.06);
    p.mesh.scale.setScalar(s / p.baseSz);
  });

  // Float hubs gently
  floatNodes.forEach(f => {
    f.mesh.position.y = f.baseY + Math.sin(time*f.speed+f.phase)*0.45;
  });

  // Flicker weak edges
  edgeFlicker.forEach(ef => {
    ef.line.material.opacity = ef.baseOp*(0.5+0.5*Math.sin(time*ef.speed+ef.phase));
  });

  // Synaptic sparks along hub edges
  if(time - lastSpark > 0.18 && hubEdges.length){
    const e = hubEdges[Math.floor(Math.random()*hubEdges.length)];
    spawnSpark(e.from, e.to, e.color);
    lastSpark = time;
  }
  tickSparks(dt);

  // Raycasting
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables);
  if(hits.length){
    const obj = hits[0].object;
    if(obj !== hoveredMesh){
      hoveredMesh = obj;
      hlName.textContent = obj.userData.label||'';
      hlStat.textContent = obj.userData.stat||'';
      hoverLabel.classList.add('show');
      document.body.style.cursor='pointer';
    }
  } else {
    if(hoveredMesh){
      hoveredMesh=null;
      hoverLabel.classList.remove('show');
      document.body.style.cursor='default';
    }
  }

  controls.update();
  composer.render();
}

// ── Data fetch & init ─────────────────────────────────
async function safeGet(url){
  try{
    const r=await fetch(url,{credentials:'same-origin'});
    return r.ok?r.json():null;
  }catch{return null;}
}

async function init(){
  const [worldData, topicData] = await Promise.all([
    safeGet('/api/world-state/'),
    safeGet('/api/topic-insights/'),
  ]);

  const w  = worldData||{};
  const td = topicData||{};

  document.getElementById('hudExam').textContent   = w.exam   ||'Your Exam';
  document.getElementById('hudLevel').textContent  = w.level  ||'Beginner';
  document.getElementById('hudStreak').textContent = (w.mastery_streak||0)+' 🔥';

  buildCenterNode(w.level);

  const subjects = (w.subjects && w.subjects.length) ? w.subjects : [
    {name:'Math',      strength_score:0.5, previous_strength_score:0.40, average_confusion_index:0.2, total_confused_questions:3},
    {name:'Reasoning', strength_score:0.7, previous_strength_score:0.60, average_confusion_index:0.3, total_confused_questions:2},
    {name:'English',   strength_score:0.3, previous_strength_score:0.35, average_confusion_index:0.5, total_confused_questions:5},
  ];

  const weak   = td.weak_topics   || [];
  const strong = td.strong_topics || [];

  subjects.forEach((s, i) => {
    buildHub(s, i, subjects.length, weak, strong);
    // Register edges for spark system
    const angle = (i/subjects.length)*Math.PI*2;
    const ringR = 10;
    const from  = new THREE.Vector3(0,0,0);
    const to    = new THREE.Vector3(Math.cos(angle)*ringR, 0, Math.sin(angle)*ringR);
    hubEdges.push({from, to, color: HUB_COLORS[i%HUB_COLORS.length]});
  });

  document.getElementById('hudNodes').textContent =
    subjects.length + weak.length + strong.length;

  // Hide loader
  const loader = document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(()=>loader.remove(), 950);

  animate();
}

window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

init();
</script>
</body>
</html>
