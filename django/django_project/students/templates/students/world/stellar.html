<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stellar — Performance Universe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #c { display: block; width: 100vw; height: 100vh; }

  /* Loading */
  #loading {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000;
    transition: opacity 0.9s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .load-star {
    font-size: 2.5rem;
    animation: loadSpin 2s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes loadSpin { to { transform: rotate(360deg); } }
  .load-title {
    font-size: 1.6rem; font-weight: 800; letter-spacing: 0.25em;
    background: linear-gradient(90deg, #6c63ff, #00d4aa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 20px;
  }
  .load-bar-track { width: 220px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden; }
  .load-bar-fill { height: 100%; background: linear-gradient(90deg, #6c63ff, #00d4aa); animation: loadFill 2s ease forwards; }
  @keyframes loadFill { from { width: 0 } to { width: 100% } }
  .load-sub { font-size: 0.68rem; color: rgba(255,255,255,0.25); margin-top: 14px; letter-spacing: 0.14em; }

  /* Topbar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 46px;
    background: rgba(0,0,6,0.7); backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; padding: 0 20px; gap: 14px;
    z-index: 100;
  }
  .tb-brand { font-size: 0.88rem; font-weight: 800; color: #6c63ff; letter-spacing: 0.04em; }
  .tb-sep   { color: rgba(255,255,255,0.15); font-size: 0.8rem; }
  .tb-page  { font-size: 0.72rem; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; text-transform: uppercase; }
  .tb-links { margin-left: auto; display: flex; gap: 8px; }
  .tb-links a {
    color: rgba(255,255,255,0.4); font-size: 0.72rem; text-decoration: none;
    padding: 3px 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    transition: all 0.2s; letter-spacing: 0.04em;
  }
  .tb-links a:hover { color: #fff; border-color: rgba(255,255,255,0.25); }

  /* HUD bottom strip */
  #hud {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 0; align-items: stretch;
    background: rgba(4,4,16,0.78); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 50px;
    overflow: hidden;
    z-index: 100;
    animation: hudIn 0.7s 1.2s ease both;
    white-space: nowrap;
  }
  @keyframes hudIn {
    from { opacity: 0; transform: translateX(-50%) translateY(18px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .hud-chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 20px; gap: 2px;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .hud-chip:last-child { border-right: none; }
  .hud-val  { font-size: 0.82rem; font-weight: 700; line-height: 1; }
  .hud-lbl  { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); }

  /* Hover label */
  #hoverLabel {
    position: fixed; pointer-events: none; z-index: 200;
    background: rgba(4,4,20,0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 8px 16px; font-size: 0.78rem;
    opacity: 0; transition: opacity 0.15s;
    display: flex; flex-direction: column; gap: 3px;
  }
  #hoverLabel.show { opacity: 1; }
  #hoverLabel .hl-name { font-weight: 700; font-size: 0.86rem; }
  #hoverLabel .hl-stat { color: rgba(255,255,255,0.5); font-size: 0.72rem; }

  /* Side info panel */
  #infoPanel {
    position: fixed; top: 56px; right: 0;
    width: 270px;
    background: rgba(4,4,20,0.88); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.07);
    border-right: none; border-radius: 12px 0 0 12px;
    padding: 22px 20px; z-index: 100;
    transform: translateX(102%);
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #infoPanel.open { transform: translateX(0); }
  .ip-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: rgba(255,255,255,0.3);
    font-size: 1rem; cursor: pointer; line-height: 1; padding: 4px;
  }
  .ip-close:hover { color: #fff; }
  .ip-name { font-size: 1.05rem; font-weight: 800; margin-bottom: 16px; }
  .ip-metric { margin-bottom: 12px; }
  .ip-metric-row { display: flex; justify-content: space-between; font-size: 0.74rem; margin-bottom: 4px; }
  .ip-metric-lbl { color: rgba(255,255,255,0.4); }
  .ip-bar-track { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
  .ip-bar-fill { height: 100%; border-radius: 3px; transition: width 0.7s ease; }
  .ip-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 14px 0; }
  .ip-legend { font-size: 0.68rem; color: rgba(255,255,255,0.3); line-height: 1.8; }
  .ip-legend span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  /* Click hint */
  #clickHint {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    font-size: 0.66rem; color: rgba(255,255,255,0.22); letter-spacing: 0.1em;
    text-transform: uppercase; pointer-events: none;
    animation: hintFade 3s 3s ease both;
  }
  @keyframes hintFade { 0%,70%{opacity:1} 100%{opacity:0} }

  /* Mobile */
  @media (max-width: 600px) {
    #hud { flex-wrap: wrap; border-radius: 16px; width: calc(100% - 32px); justify-content: center; bottom: 16px; }
    .hud-chip { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); width: 45%; }
    #infoPanel { width: 100%; top: auto; bottom: 0; border-radius: 16px 16px 0 0; border-right: 1px solid rgba(255,255,255,0.07); transform: translateY(102%); }
    #infoPanel.open { transform: translateY(0); }
  }
</style>
</head>

<canvas id="c"></canvas>

<div id="loading">
  <div class="load-star">✦</div>
  <div class="load-title">STELLAR</div>
  <div class="load-bar-track"><div class="load-bar-fill"></div></div>
  <div class="load-sub">MAPPING YOUR UNIVERSE</div>
</div>

<nav id="topbar">
  <span class="tb-brand">TutionPlus</span>
  <span class="tb-sep">|</span>
  <span class="tb-page">Stellar View</span>
  <div class="tb-links">
    <a href="/api/performance-dashboard/">← Dashboard</a>

  </div>

<div id="hud">
  <div class="hud-chip">
    <span class="hud-val" id="hudExam">—</span>
    <span class="hud-lbl">Exam</span>
  </div>
  <div class="hud-chip">
    <span class="hud-val" id="hudLevel" style="color:#6c63ff">—</span>

  </div>
  <div class="hud-chip">
    <span class="hud-val" id="hudStreak" style="color:#00d4aa">0 🔥</span>

  </div>
  <div class="hud-chip" style="max-width:160px">
    <span class="hud-val" id="hudRec" style="font-size:.68rem;color:rgba(255,255,255,.55);white-space:normal;text-align:center;line-height:1.4">—</span>

</div>

</div>

  <button class="ip-close" onclick="closePanel()">✕</button>
  <div id="ipContent"></div>
</div>

<!-- Three.js same CDN as existing pages -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>

<script>
/* ═══════════════════════════════════════════════
   STELLAR — Data-driven academic universe
   Each planet = one subject, sized by strength.
   Confusion = swirling fog around planets.
   Level = the Sun at the center.
═══════════════════════════════════════════════ */

// ── Config ──────────────────────────────────────
const SUBJECT_PALETTE = [0x4fc3f7, 0xce93d8, 0x4db6ac, 0xffcc80, 0xef9a9a, 0x90caf9];
const ORBIT_RADII     = [7, 11.5, 16, 20.5, 25, 30];
const ORBIT_SPEEDS    = [0.28, 0.20, 0.15, 0.11, 0.08, 0.06]; // rad/sec

const LEVEL_CONFIG = {
  'beginner':     { color: 0xff8c00, size: 1.3, bloom: 3.0 },
  'intermediate': { color: 0xffcc00, size: 1.6, bloom: 3.5 },
  'advanced':     { color: 0x00bfff, size: 1.9, bloom: 4.5 },
  'expert':       { color: 0xe0f0ff, size: 2.2, bloom: 5.5 },
  'master':       { color: 0xff6ec7, size: 2.5, bloom: 7.0 },
};

// ── Scene ────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x030308);

const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 800);
camera.position.set(0, 22, 40);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance   = 5;
controls.maxDistance   = 80;
controls.autoRotate    = true;
controls.autoRotateSpeed = 0.4;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ── Post-processing ──────────────────────────────
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.4,  // strength
  0.55, // radius
  0.22  // threshold — only bright emissive objects glow
);
composer.addPass(bloomPass);

// ── Lighting ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x10102a, 1.2));

// ── State ────────────────────────────────────────
const planets      = [];
const shootStars   = [];
const clickables   = [];
let   sunMesh      = null;
let   sunLight     = null;
let   masteryStreak = 0;
let   time          = 0;
let   lastShoot     = 0;
let   hoveredMesh   = null;
const raycaster    = new THREE.Raycaster();
const mouse        = new THREE.Vector2(-9999, -9999);

// ── Static: Deep-space starfield ─────────────────
(function buildStarfield() {
  const count = 14000;
  const pos   = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r     = 120 + Math.random() * 280;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.45, sizeAttenuation: true,
    transparent: true, opacity: 0.75,
  })));
})();

// ── Static: Galactic band (denser star ring) ─────
(function buildGalaxyBand() {
  const count = 6000;
  const pos   = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const angle  = Math.random() * Math.PI * 2;
    const radius = 90 + Math.random() * 130;
    pos[i*3]   = Math.cos(angle) * radius;
    pos[i*3+1] = (Math.random() - 0.5) * 50;
    pos[i*3+2] = Math.sin(angle) * radius;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x8899ff, size: 0.28, sizeAttenuation: true,
    transparent: true, opacity: 0.35,
  })));
})();

// ── Helpers ──────────────────────────────────────

function makeOrbitRing(radius, color) {
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.15 });
  return new THREE.Line(geo, mat);
}

function makeConfusionCloud(confIdx, color, planetR) {
  const count = Math.max(12, Math.floor(confIdx * 200));
  const pos   = new Float32Array(count * 3);
  const r1 = planetR * 1.5, r2 = planetR * 2.6;
  for (let i = 0; i < count; i++) {
    const r     = r1 + Math.random() * (r2 - r1);
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color,
    size: 0.07 + confIdx * 0.06,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.5 + confIdx * 0.4,
  }));
}

function makeSprite(text, opts) {
  const W = 512, H = 112;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // Background pill
  ctx.fillStyle = opts.bg || 'rgba(0,0,0,0.55)';
  const r = 12;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(W-r, 0);
  ctx.quadraticCurveTo(W, 0, W, r);
  ctx.lineTo(W, H-r); ctx.quadraticCurveTo(W, H, W-r, H);
  ctx.lineTo(r, H); ctx.quadraticCurveTo(0, H, 0, H-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = opts.border || 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = opts.color || '#ffffff';
  ctx.font = opts.font || 'bold 28px Segoe UI, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxLen = 36;
  const label  = text.length > maxLen ? text.slice(0, maxLen - 1) + '…' : text;
  ctx.fillText(label, W / 2, H / 2);

  const mat = new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv),
    transparent: true, depthWrite: false,
  });
  const sp  = new THREE.Sprite(mat);
  sp.scale.set(opts.w || 5, opts.h || 1.2, 1);
  return sp;
}

function confColor(v) {
  if (v <= 0.25) return 0x00d4aa;
  if (v <= 0.5)  return 0xffb344;
  return 0xff4d6d;
}

function hexCss(intColor) {
  return '#' + intColor.toString(16).padStart(6, '0');
}

function pct(v) { return Math.round((v || 0) * 100); }

// ── Build Sun ─────────────────────────────────────
function buildSun(levelStr) {
  const key = (levelStr || 'beginner').toLowerCase();
  const cfg = LEVEL_CONFIG[key] || LEVEL_CONFIG['beginner'];

  // Core
  const mat = new THREE.MeshStandardMaterial({
    color: cfg.color, emissive: cfg.color,
    emissiveIntensity: cfg.bloom,
    roughness: 0.3, metalness: 0.0,
  });
  sunMesh = new THREE.Mesh(new THREE.SphereGeometry(cfg.size, 40, 40), mat);
  scene.add(sunMesh);

  // Inner halo (back-face, additive)
  const halo1 = new THREE.Mesh(
    new THREE.SphereGeometry(cfg.size * 1.6, 32, 32),
    new THREE.MeshBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.055, side: THREE.BackSide })
  );
  scene.add(halo1);

  // Outer corona
  const halo2 = new THREE.Mesh(
    new THREE.SphereGeometry(cfg.size * 2.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.025, side: THREE.BackSide })
  );
  scene.add(halo2);

  // Scene light from sun
  sunLight = new THREE.PointLight(cfg.color, 2.5, 70, 1.4);
  scene.add(sunLight);
}

// ── Build Planets ─────────────────────────────────
function buildPlanet(subj, idx, weakTopics, strongTopics) {
  const color      = SUBJECT_PALETTE[idx % SUBJECT_PALETTE.length];
  const orbitR     = ORBIT_RADII[idx % ORBIT_RADII.length];
  const orbitSpeed = ORBIT_SPEEDS[idx % ORBIT_SPEEDS.length];
  const strength   = subj.strength_score || 0.5;
  const prevStr    = subj.previous_strength_score || 0.4;
  const confusion  = subj.average_confusion_index || 0;
  const planetR    = 0.38 + strength * 1.05;
  const startAngle = (idx / 6) * Math.PI * 2;

  // Orbit path ring (world space)
  scene.add(makeOrbitRing(orbitR, color));

  // Previous-strength ghost ring (slightly smaller, more transparent)
  scene.add(makeOrbitRing(orbitR * (0.85 + prevStr * 0.15), color));

  // Planet group (moves every frame)
  const group = new THREE.Group();
  scene.add(group);

  // Planet mesh
  const planetMat = new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.55 + strength * 0.85,
    roughness: 0.55,
    metalness: 0.05,
  });
  const planetMesh = new THREE.Mesh(new THREE.SphereGeometry(planetR, 32, 32), planetMat);
  planetMesh.userData = { subject: subj, color, orbitR };
  group.add(planetMesh);
  clickables.push(planetMesh);

  // Atmosphere shell
  group.add(new THREE.Mesh(
    new THREE.SphereGeometry(planetR * 1.22, 24, 24),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.055 + strength * 0.055, side: THREE.BackSide })
  ));

  // Confusion cloud (if notable)
  if (confusion > 0.04) {
    const cloud = makeConfusionCloud(confusion, confColor(confusion), planetR);
    group.add(cloud);
  }

  // Strong-topic moons (up to 2, small green spheres)
  const myStrong = strongTopics
    .filter(t => t.subject && subj.name && t.subject.toLowerCase() === subj.name.toLowerCase())
    .slice(0, 2);

  const moons = [];
  myStrong.forEach((t, mi) => {
    const moonR = planetR * 0.28;
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(moonR, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0x4db6ac, emissive: 0x4db6ac, emissiveIntensity: 1.4, roughness: 0.5 })
    );
    const dist  = planetR * 2.1 + mi * planetR * 0.7;
    moons.push({ mesh: moonMesh, dist, angle: mi * Math.PI, speed: 1.2 + mi * 0.5 });
    group.add(moonMesh);
  });

  // Weak-topic asteroids (up to 4, small red icosahedra)
  const myWeak = weakTopics
    .filter(t => t.subject && subj.name && t.subject.toLowerCase() === subj.name.toLowerCase())
    .slice(0, 4);

  myWeak.forEach((t, ai) => {
    const astR  = planetR * 0.11 + Math.random() * planetR * 0.06;
    const astMesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(astR, 0),
      new THREE.MeshStandardMaterial({ color: 0xff4d6d, emissive: 0xff4d6d, emissiveIntensity: 0.9, roughness: 0.9 })
    );
    const dist  = planetR * 1.8 + ai * planetR * 0.55;
    const ang   = (ai / 4) * Math.PI * 2;
    astMesh.position.set(
      Math.cos(ang) * dist,
      (Math.random() - 0.5) * planetR * 0.9,
      Math.sin(ang) * dist
    );
    group.add(astMesh);
  });

  // Subject label sprite
  const lsp = makeSprite(subj.name, {
    bg: 'rgba(0,0,0,0.6)',
    border: hexCss(color),
    color: '#ffffff',
    font: 'bold 26px Segoe UI, sans-serif',
    w: 4.2, h: 1.1,
  });
  lsp.position.set(0, planetR + 1.1, 0);
  group.add(lsp);

  planets.push({ group, mesh: planetMesh, moons, angle: startAngle, orbitR, orbitSpeed, color, subj });
}

// ── Recommendation sprite ─────────────────────────
function buildRecSprite(text) {
  if (!text || text === 'Continue current practice') return;
  const sp = makeSprite('💡  ' + text, {
    bg: 'rgba(0,40,36,0.6)',
    border: '#00d4aa',
    color: '#00d4aa',
    font: '21px Segoe UI, sans-serif',
    w: 9, h: 2,
  });
  sp.position.set(0, 9, 0);
  sp.userData.floatY = 9;
  sp.name = 'rec';
  scene.add(sp);
}

// ── Shooting stars ────────────────────────────────
function spawnShootStar() {
  const r   = 28 + Math.random() * 18;
  const ang = Math.random() * Math.PI * 2;
  const y   = (Math.random() - 0.5) * 24;
  const s   = new THREE.Vector3(Math.cos(ang) * r, y, Math.sin(ang) * r);
  const dir = new THREE.Vector3(-Math.cos(ang), (Math.random() - 0.5) * 0.15, -Math.sin(ang))
    .add(new THREE.Vector3((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.4))
    .normalize();
  const len = 3.5 + Math.random() * 5;
  const e   = s.clone().addScaledVector(dir, len);

  const geo = new THREE.BufferGeometry().setFromPoints([s, e]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  shootStars.push({ line, dir, speed: 20 + Math.random() * 14, life: 1.0, decay: 0.9 + Math.random() * 0.5 });
}

function tickShootStars(dt) {
  for (let i = shootStars.length - 1; i >= 0; i--) {
    const s   = shootStars[i];
    s.life   -= s.decay * dt;
    const pos = s.line.geometry.attributes.position;
    for (let j = 0; j < pos.count; j++) {
      pos.setXYZ(j,
        pos.getX(j) + s.dir.x * s.speed * dt,
        pos.getY(j) + s.dir.y * s.speed * dt,
        pos.getZ(j) + s.dir.z * s.speed * dt
      );
    }
    pos.needsUpdate = true;
    s.line.material.opacity = Math.max(0, s.life);
    if (s.life <= 0) {
      scene.remove(s.line);
      s.line.geometry.dispose();
      s.line.material.dispose();
      shootStars.splice(i, 1);
    }
  }
}

// ── Interaction ───────────────────────────────────
const hoverLabel = document.getElementById('hoverLabel');
const hlName     = document.getElementById('hlName');
const hlStat     = document.getElementById('hlStat');
const infoPanel  = document.getElementById('infoPanel');
const ipContent  = document.getElementById('ipContent');

function closePanel() { infoPanel.classList.remove('open'); }

function openPanel(subj, color) {
  const css     = hexCss(color);
  const str     = pct(subj.strength_score);
  const prev    = pct(subj.previous_strength_score);
  const conf    = pct(subj.average_confusion_index);
  const cq      = subj.total_confused_questions || 0;
  const delta   = str - prev;
  const dHtml   = delta >= 0
    ? `<span style="color:#00d4aa">▲${delta}%</span>`
    : `<span style="color:#ff4d6d">▼${Math.abs(delta)}%</span>`;
  const confCss = conf > 50 ? '#ff4d6d' : conf > 25 ? '#ffb344' : '#00d4aa';

  ipContent.innerHTML = `
    <div class="ip-name" style="color:${css}">${subj.name}</div>

    <div class="ip-metric">
      <div class="ip-metric-row">
        <span class="ip-metric-lbl">Strength</span>
        <span style="font-size:.8rem;font-weight:700">${str}% ${dHtml}</span>
      </div>
      <div class="ip-bar-track">
        <div class="ip-bar-fill" style="width:${str}%;background:${css}"></div>
      </div>
    </div>

    <div class="ip-metric">
      <div class="ip-metric-row">
        <span class="ip-metric-lbl">Previous</span>
        <span style="font-size:.78rem;color:rgba(255,255,255,.55)">${prev}%</span>
      </div>
      <div class="ip-bar-track">
        <div class="ip-bar-fill" style="width:${prev}%;background:rgba(255,255,255,.22)"></div>
      </div>
    </div>

    <div class="ip-metric">
      <div class="ip-metric-row">
        <span class="ip-metric-lbl">Confusion Index</span>
        <span style="font-size:.8rem;font-weight:700;color:${confCss}">${conf}%</span>
      </div>
      <div class="ip-bar-track">
        <div class="ip-bar-fill" style="width:${conf}%;background:${confCss}"></div>
      </div>
    </div>

    <div class="ip-metric-row" style="margin-top:4px">
      <span class="ip-metric-lbl">Confused Questions</span>
      <span style="font-size:.8rem;font-weight:700">${cq}</span>
    </div>

    <div class="ip-divider"></div>
    <div class="ip-legend">
      <span style="background:#4db6ac"></span> Green moons = strong topics<br>
      <span style="background:#ff4d6d"></span> Red rocks = weak topics<br>
      <span style="background:${confCss}"></span> Particle cloud = confusion
    </div>
  `;
  infoPanel.classList.add('open');
}

window.addEventListener('mousemove', e => {
  mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  hoverLabel.style.left = (e.clientX + 16) + 'px';
  hoverLabel.style.top  = (e.clientY - 12) + 'px';
});

window.addEventListener('click', () => {
  if (hoveredMesh) openPanel(hoveredMesh.userData.subject, hoveredMesh.userData.color);
});

// Touch tap
window.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  mouse.x =  (t.clientX / innerWidth)  * 2 - 1;
  mouse.y = -(t.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables);
  if (hits.length) openPanel(hits[0].object.userData.subject, hits[0].object.userData.color);
}, { passive: true });

// ── Animation loop ────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  // Sun pulse + rotate
  if (sunMesh) {
    sunMesh.scale.setScalar(1 + Math.sin(time * 1.8) * 0.025);
    sunMesh.rotation.y += 0.004;
  }

  // Planets orbit + rotate
  planets.forEach(p => {
    p.angle += p.orbitSpeed * dt;
    p.group.position.set(
      Math.cos(p.angle) * p.orbitR,
      0,
      Math.sin(p.angle) * p.orbitR
    );
    p.mesh.rotation.y += 0.009;

    // Spin confusion cloud
    p.group.children.forEach(ch => {
      if (ch.isPoints) ch.rotation.y += 0.014;
    });

    // Orbit moons
    p.moons.forEach(m => {
      m.angle += m.speed * dt;
      m.mesh.position.set(
        Math.cos(m.angle) * m.dist,
        0,
        Math.sin(m.angle) * m.dist
      );
    });
  });

  // Recommendation sprite float
  const rec = scene.getObjectByName('rec');
  if (rec) rec.position.y = rec.userData.floatY + Math.sin(time * 0.7) * 0.35;

  // Shooting stars — frequency based on streak
  const interval = masteryStreak > 5 ? 0.45 : masteryStreak > 0 ? 1.4 : 3.5;
  if (time - lastShoot > interval) {
    spawnShootStar();
    lastShoot = time;
    if (masteryStreak > 3 && Math.random() > 0.5) setTimeout(spawnShootStar, 120);
  }
  tickShootStars(dt);

  // Hover raycasting
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables);
  if (hits.length) {
    const obj  = hits[0].object;
    const subj = obj.userData.subject;
    if (obj !== hoveredMesh) {
      hoveredMesh = obj;
      hlName.textContent = subj.name;
      hlStat.textContent = `Strength ${pct(subj.strength_score)}%  ·  Confusion ${pct(subj.average_confusion_index)}%`;
      hoverLabel.classList.add('show');
      document.body.style.cursor = 'pointer';
    }
  } else {
    if (hoveredMesh) {
      hoveredMesh = null;
      hoverLabel.classList.remove('show');
      document.body.style.cursor = 'default';
    }
  }

  controls.update();
  composer.render();
}

// ── Fetch & Init ──────────────────────────────────
async function safeGet(url) {
  try {
    const r = await fetch(url, { credentials: 'same-origin' });
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function init() {
  const [worldData, topicData] = await Promise.all([
    safeGet('/api/world-state/'),
    safeGet('/api/topic-insights/'),
  ]);

  const w  = worldData || {};
  const td = topicData || {};

  // HUD
  document.getElementById('hudExam').textContent   = w.exam   || 'Your Exam';
  document.getElementById('hudLevel').textContent  = w.level  || 'Beginner';
  document.getElementById('hudStreak').textContent = (w.mastery_streak || 0) + ' 🔥';
  document.getElementById('hudRec').textContent    = w.recommendation || '—';
  masteryStreak = w.mastery_streak || 0;

  // Build sun
  buildSun(w.level);

  // Build planets — fallback to demo data if API empty
  const subjects = (w.subjects && w.subjects.length) ? w.subjects : [
    { name: 'Math',      strength_score: 0.5,  previous_strength_score: 0.40, average_confusion_index: 0.2,  total_confused_questions: 3 },
    { name: 'Reasoning', strength_score: 0.7,  previous_strength_score: 0.60, average_confusion_index: 0.3,  total_confused_questions: 2 },
    { name: 'English',   strength_score: 0.3,  previous_strength_score: 0.35, average_confusion_index: 0.5,  total_confused_questions: 5 },
  ];

  const weak   = td.weak_topics   || [];
  const strong = td.strong_topics || [];

  subjects.forEach((s, i) => buildPlanet(s, i, weak, strong));

  // Recommendation
  buildRecSprite(w.recommendation);

  // Hide loader
  const loader = document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 950);

  animate();
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

window.closePanel = closePanel;
init();
</script>
</body>
</html>
