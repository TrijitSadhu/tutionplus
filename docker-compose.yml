# ─── LOCAL DEVELOPMENT ───────────────────────────────────────────────────────
# Usage: docker compose up --build
# App runs at http://localhost:8000

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=django_project.settings_docker
    volumes:
      # Live code reload — bind mount your local code into the container
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=django_project.settings_docker
    volumes:
      - .:/app
    command: >
      bash -c "cd /app/django/django_project &&
               celery -A django_project worker --loglevel=info"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
