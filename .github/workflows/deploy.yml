name: Deploy to VPS

on:
  push:
    branches:
      - main   # triggers on every push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Interserver VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/tutionplus/app

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing/updating Python dependencies..."
            /home/tutionplus/venv/bin/pip install -r requirements.txt

            echo "==> Backing up database before deploy..."
            chmod +x /home/tutionplus/app/scripts/backup_db.sh
            bash /home/tutionplus/app/scripts/backup_db.sh

            echo "==> Running migrations..."
            cd /home/tutionplus/app/django/django_project
            set -a; source /home/tutionplus/app/.env; set +a
            export DJANGO_SETTINGS_MODULE=django_project.settings_production
            /home/tutionplus/venv/bin/python manage.py migrate --noinput

            echo "==> Collecting static files..."
            /home/tutionplus/venv/bin/python manage.py collectstatic --noinput

            echo "==> Syncing systemd unit files..."
            cp /home/tutionplus/app/deploy/systemd/gunicorn.service /etc/systemd/system/gunicorn.service
            systemctl daemon-reload

            echo "==> Restarting application service..."
            systemctl restart gunicorn

            echo "==> Deploy complete!"
