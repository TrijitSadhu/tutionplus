# ─── PRODUCTION (DigitalOcean) ────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# App runs at http://your-server-ip (port 80)

services:

  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # No port exposed to host in production (only accessible inside Docker network)

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=django_project.settings_docker
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - 8000
    depends_on:
      - db
      - redis

  celery:
    build: .
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=django_project.settings_docker
    command: >
      bash -c "cd /app/django/django_project &&
               celery -A django_project worker --loglevel=info"
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
